<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lengua Quest 6º · Tema 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --ink:#2b2340; --soft:#6b6385; --card:#ffffff;
  --teal:#1f8a8a; --orange:#f07b2c; --red:#e2474b; --yellow:#ffc53d; --green:#2fa86a; --purple:#7a5cd6; --pink:#e85a9b;
  --shadow:0 6px 0 rgba(43,35,64,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{min-height:100vh;background-image:radial-gradient(circle at 10% 0%,#ffe3c2 0,transparent 40%),radial-gradient(circle at 100% 100%,#d4f1ee 0,transparent 45%)}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{font-family:"Baloo 2",cursive;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0}
.hidden{display:none!important}

/* Home */
.hero{text-align:center;padding:10px 0 18px}
.hero .badge{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:.85rem;letter-spacing:.03em}
.hero h1{font-size:2.4rem;margin-top:8px;color:var(--ink)}
.hero h1 span{color:var(--orange)}
.hero p{color:var(--soft);margin:6px 0 0;font-weight:700}
.total{display:flex;justify-content:center;gap:10px;margin:12px 0 4px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.mission{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);border:3px solid transparent;transition:transform .12s}
.mission:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,35,64,.12)}
.mission .ico{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;color:#fff}
.mission h3{font-size:1.25rem}
.mission small{display:block;color:var(--soft);font-weight:700;margin-top:2px}
.mission .stars{margin-left:auto;font-size:1.1rem;letter-spacing:1px;white-space:nowrap}
.stop{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff}
.stop small{color:#ffe9dc}
.stop .ico{background:rgba(255,255,255,.2)!important}

/* Game */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:#fff;border-radius:14px;width:44px;height:44px;font-size:1.3rem;box-shadow:var(--shadow)}
.bar{flex:1;height:14px;background:#eadfcf;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:999px;transition:width .35s}
.score{font-weight:800;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);min-width:64px;text-align:center}
.timer{font-weight:800;background:var(--red);color:#fff;border-radius:14px;padding:8px 12px;min-width:58px;text-align:center}
.streak{font-weight:800;color:var(--orange);text-align:right;min-height:1.3em;font-size:.95rem}
.qcard{background:#fff;border-radius:24px;padding:20px 18px;box-shadow:var(--shadow);margin-top:6px}
.tag{display:inline-block;font-weight:800;font-size:.78rem;color:#fff;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.qtext{font-size:1.15rem;font-weight:800;margin:0 0 10px}
.ctx{font-size:1.2rem;background:#f6f1ff;border-left:6px solid var(--purple);border-radius:12px;padding:12px 14px;margin:0 0 14px;line-height:1.45}
.ctx mark{background:var(--yellow);border-radius:6px;padding:0 4px;font-weight:800;color:var(--ink)}
.word{font-family:"Baloo 2";font-size:2.4rem;text-align:center;margin:4px 0 14px;color:var(--purple)}
.opts{display:grid;gap:10px}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:3px solid #e6def5;border-radius:16px;padding:13px 14px;text-align:left;font-weight:800;font-size:1rem;color:var(--ink);box-shadow:0 4px 0 #e6def5;transition:transform .1s}
.cols3 .opt{text-align:center;padding:16px 6px}
.opt:active{transform:translateY(2px)}
.opt.ok{background:#e3f7ec;border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.bad{background:#fde6e7;border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:16px;padding:14px;font-weight:700;line-height:1.4}
.fb.ok{background:#e3f7ec;color:#145c39}
.fb.bad{background:#fde6e7;color:#8a1f22}
.fb b{font-family:"Baloo 2";font-size:1.15rem;display:block;margin-bottom:2px}
.next{display:block;width:100%;margin-top:14px;background:var(--teal);color:#fff;font-weight:800;font-size:1.1rem;padding:15px;border-radius:16px;box-shadow:0 5px 0 #136363}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #136363}

/* Results */
.res{text-align:center;background:#fff;border-radius:24px;padding:24px 18px;box-shadow:var(--shadow)}
.res .big{font-size:3rem;letter-spacing:6px;margin:8px 0}
.res h2{font-size:2rem}
.res p{color:var(--soft);font-weight:700}
.review{text-align:left;margin-top:16px}
.review h3{font-size:1.2rem;margin-bottom:8px}
.review li{margin-bottom:10px;line-height:1.35}
.review li span{color:var(--soft);font-weight:700;display:block;font-size:.92rem}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1}
.ghost{background:#fff;border:3px solid var(--teal);color:var(--teal);font-weight:800;padding:13px;border-radius:16px}
.tip{background:#fff;border-radius:18px;padding:14px 16px;margin-top:16px;box-shadow:var(--shadow);font-weight:700;color:var(--soft);font-size:.95rem}
.tip b{color:var(--ink)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:380px){.hero h1{font-size:2rem}.cols3 .opt{font-size:.9rem}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <div id="homeLink" style="text-align:left;min-height:8px"></div>
    <div class="hero">
      <span class="badge">LENGUA · 6.º PRIMARIA · TEMA 2</span>
      <h1>Misión <span>Lengua</span></h1>
      <p>Supera las 5 misiones y luego juega al ¡Stop! contrarreloj</p>
      <div class="total"><span class="pill" id="totalStars">⭐ 0 / 15</span></div>
    </div>
    <div class="grid" id="missions"></div>
    <div class="tip"><b>Cómo se juega:</b> elige la respuesta correcta. Si fallas, lee la explicación: ¡así se aprende! Consigue 3 estrellas acertando casi todas.</div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="top">
      <button class="back" id="btnBack" aria-label="Volver">←</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="timer hidden" id="timer">60</div>
      <div class="score" id="score">0</div>
    </div>
    <div class="streak" id="streak"></div>
    <div class="qcard">
      <span class="tag" id="tag"></span>
      <p class="qtext" id="qtext"></p>
      <div id="ctx" class="ctx hidden"></div>
      <div id="word" class="word hidden"></div>
      <div class="opts" id="opts"></div>
      <div id="fb" class="fb hidden"></div>
      <button class="next hidden" id="btnNext">Siguiente →</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="res">
      <h2 id="rTitle">¡Misión cumplida!</h2>
      <div class="big" id="rStars">⭐⭐⭐</div>
      <p id="rText"></p>
      <div class="review hidden" id="rReview"><h3>Para repasar</h3><ul id="rList"></ul></div>
      <div class="row">
        <button class="ghost" id="btnHome">Menú</button>
        <button class="next" style="margin-top:0" id="btnAgain">Otra vez</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------- GENERADOR DE PREGUNTAS (contenido de la lección, tema 2) ---------- */
const ROUND = 20;
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
function sample(a,k){ return shuffle(a).slice(0,k); }
function mc(q, correct, wrongs, e, ctx){ const w=[...new Set(wrongs.filter(x=>x!==correct))].slice(0,3); return {ctx, q, o:[correct,...w], a:0, e}; }

/* ===== DETERMINANTES ===== */
const NOUNS = [
 ["libro","m","s"],["balón","m","s"],["perro","m","s"],["árbol","m","s"],["cuaderno","m","s"],["sillón","m","s"],
 ["mesa","f","s"],["casa","f","s"],["silla","f","s"],["mochila","f","s"],["pelota","f","s"],["bicicleta","f","s"],
 ["coches","m","p"],["lápices","m","p"],["zapatos","m","p"],["cuadernos","m","p"],["cromos","m","p"],["juguetes","m","p"],
 ["flores","f","p"],["galletas","f","p"],["ventanas","f","p"],["camisetas","f","p"],["fresas","f","p"],["pinturas","f","p"]];
const FRAMES = ["Mira {D} {N}.","Me encanta jugar con {D} {N}.","Guarda {D} {N} en el armario.","Pinta {D} {N} de azul.","Busca {D} {N}, por favor.","He encontrado {D} {N} en el parque.","Ayer vi {D} {N} en una tienda."];
const KEY = (g,n)=> g+n; // ms, fs, mp, fp
const GN = {ms:"masculino singular",fs:"femenino singular",mp:"masculino plural",fp:"femenino plural"};
const ART_DET = {ms:"el",fs:"la",mp:"los",fp:"las"}, ART_IND = {ms:"un",fs:"una",mp:"unos",fp:"unas"};
const DEM = {
 "Cercanía":{ms:"este",fs:"esta",mp:"estos",fp:"estas"},
 "Distancia media":{ms:"ese",fs:"esa",mp:"esos",fp:"esas"},
 "Lejanía":{ms:"aquel",fs:"aquella",mp:"aquellos",fp:"aquellas"}};
const POS = [
 {per:1,pos:"un",f:{ms:"mi",fs:"mi",mp:"mis",fp:"mis"}},
 {per:2,pos:"un",f:{ms:"tu",fs:"tu",mp:"tus",fp:"tus"}},
 {per:1,pos:"varios",f:{ms:"nuestro",fs:"nuestra",mp:"nuestros",fp:"nuestras"}},
 {per:2,pos:"varios",f:{ms:"vuestro",fs:"vuestra",mp:"vuestros",fp:"vuestras"}}];
const IND = [
 {ms:"algún",fs:"alguna",mp:"algunos",fp:"algunas"},{ms:"mucho",fs:"mucha",mp:"muchos",fp:"muchas"},
 {ms:"poco",fs:"poca",mp:"pocos",fp:"pocas"},{ms:"otro",fs:"otra",mp:"otros",fp:"otras"},
 {mp:"varios",fp:"varias"},{mp:"bastantes",fp:"bastantes"}];
const NUMS = ["dos","tres","cuatro","cinco","seis","diez","doce","veinte","treinta","cien"];
const TYPES = ["Artículo determinado","Artículo indeterminado","Demostrativo","Posesivo","Numeral cardinal","Indefinido"];
const TYPE_E = {
 "Artículo determinado":"Los artículos determinados (el, la, los, las) indican que el nombre es conocido.",
 "Artículo indeterminado":"Los artículos indeterminados (un, una, unos, unas) indican que el nombre es desconocido.",
 "Demostrativo":"Los demostrativos indican la distancia: este (cerca), ese (distancia media), aquel (lejos).",
 "Posesivo":"Los posesivos indican a quién pertenece algo (mi, tu, nuestro, vuestro…).",
 "Numeral cardinal":"Los numerales cardinales indican una cantidad exacta (dos, diez, cien…).",
 "Indefinido":"Los indefinidos indican una cantidad imprecisa (algunos, muchos, pocas, varios…)."};

function makeDet(){
  const [nom,g,n] = pick(NOUNS), k = KEY(g,n);
  const opts = [["Artículo determinado",()=>ART_DET[k]],["Artículo indeterminado",()=>ART_IND[k]],
    ["Demostrativo",()=>{const d=pick(Object.keys(DEM)); return [DEM[d][k],d];}],
    ["Posesivo",()=>{const p=pick(POS); return [p.f[k],p];}],
    ["Indefinido",()=>{const c=IND.filter(x=>x[k]); return pick(c)[k];}]];
  if(n==="p") opts.push(["Numeral cardinal",()=>pick(NUMS)]);
  const [type,fn] = pick(opts); let r = fn(), extra=null;
  if(Array.isArray(r)){ extra=r[1]; r=r[0]; }
  const ctx = pick(FRAMES).replace("{D}","[["+r+"]]").replace("{N}",nom);
  return {type, word:r, extra, k, nom, ctx};
}
function cap(s){ return s.replace(/^(\[\[)?(.)/,(m,b,c)=>(b||"")+c.toUpperCase()); }
function posStr(p,k){ return `Posesivo, ${p.pos==="un"?"un poseedor":"varios poseedores"}, ${p.per}.ª persona, ${GN[k]}`; }

const GEN_DET = [
  ()=>{ const d=makeDet(); return mc("¿Qué tipo de determinante es la palabra destacada?", d.type, sample(TYPES.filter(t=>t!==d.type),3), TYPE_E[d.type], d.ctx); },
  ()=>{ let d; do{ d=makeDet(); }while(d.type!=="Demostrativo");
        const e={"Cercanía":"Este, esta, estos, estas → cercanía (aquí).","Distancia media":"Ese, esa, esos, esas → distancia media (ahí).","Lejanía":"Aquel, aquella, aquellos, aquellas → lejanía (allí)."}[d.extra];
        const q=mc("¿Qué distancia indica este demostrativo?", d.extra, Object.keys(DEM), e, d.ctx); q.fixed=true; q.o=["Cercanía","Distancia media","Lejanía"]; q.a=q.o.indexOf(d.extra); return q; },
  ()=>{ let d; do{ d=makeDet(); }while(d.type!=="Posesivo");
        const p=d.extra, k=d.k, right=posStr(p,k);
        const flip = {ms:"fs",fs:"ms",mp:"fp",fp:"mp"}, num={ms:"mp",mp:"ms",fs:"fp",fp:"fs"};
        const wr=[posStr({...p,pos:p.pos==="un"?"varios":"un"},k), posStr({...p,per:p.per===1?2:1},k), posStr(p,flip[k]), posStr(p,num[k])];
        return mc("Analízalo con la ruta del determinante:", right, sample(wr,3), `«${d.word}»: ${p.pos==="un"?"un poseedor":"varios poseedores"}, ${p.per}.ª persona; concuerda con «${d.nom}», que es ${GN[k]}.`, d.ctx); },
  ()=>{ const d=makeDet(); return mc("¿Con qué género y número concuerda este determinante?", cap(GN[d.k]), Object.values(GN).map(cap), `Concuerda con el nombre «${d.nom}», que es ${GN[d.k]}.`, d.ctx); },
  ()=>{ const o=pick([["primer","Es el {X} día de clase."],["segunda","Es la {X} vez que vengo."],["tercer","Vivo en el {X} piso."],["cuarta","Llegó en {X} posición."],["quinto","Estoy en {X} de Primaria."],["primera","Ganó la {X} medalla."]]);
        return mc("¿Qué es la palabra destacada?", "Un adjetivo (numeral ordinal)", ["Un determinante numeral cardinal","Un artículo","Un pronombre personal"], "¡Ojo! Los cardinales (dos, tres…) son determinantes, pero los ordinales (primero, segunda…) son adjetivos.", o[1].replace("{X}","[["+o[0]+"]]")); },
  ()=>mc("¿Dónde aparecen siempre los determinantes?", "Delante del nombre", ["Detrás del nombre","En lugar del nombre","Al final de la oración"], "Los determinantes van siempre delante del nombre y concuerdan con él en género y número.")
];
const W_DET = [5,2,2,2,1,1];

/* ===== PRONOMBRES ===== */
const PRON = [
 ["yo","t",1,"s","[[Yo]] llevo la merienda."],["mí","t",1,"s","Este regalo es para [[mí]]."],["conmigo","t",1,"s","¿Vienes [[conmigo]] al cine?"],
 ["tú","t",2,"s","[[Tú]] tienes la pelota."],["ti","t",2,"s","He guardado un trozo de tarta para [[ti]]."],["contigo","t",2,"s","Quiero ir [[contigo]] a la excursión."],
 ["usted","t",2,"s","¿Es [[usted]] la nueva directora?"],["él","t",3,"s","[[Él]] juega al baloncesto."],["ella","t",3,"s","[[Ella]] canta muy bien."],
 ["consigo","t",3,"s","Mi tío siempre lleva el paraguas [[consigo]]."],["nosotros","t",1,"p","[[Nosotros]] cuidamos el huerto."],["nosotras","t",1,"p","[[Nosotras]] hemos ganado el partido."],
 ["vosotros","t",2,"p","¿[[Vosotros]] venís a la fiesta?"],["vosotras","t",2,"p","[[Vosotras]] sois muy rápidas."],["ustedes","t",2,"p","¿Quieren [[ustedes]] un vaso de agua?"],
 ["ellos","t",3,"p","[[Ellos]] llegan mañana."],["ellas","t",3,"p","[[Ellas]] leen cuentos de miedo."],
 ["me","a",1,"s","[[Me]] gusta mucho el chocolate."],["te","a",2,"s","[[Te]] llamo luego."],["te","a",2,"s","[[Te]] quiero mucho."],
 ["lo","a",3,"s","El libro [[lo]] tengo yo."],["lo","a",3,"s","Quiero comprar[[lo]] hoy."],["la","a",3,"s","La puerta [[la]] cierro yo."],
 ["le","a",3,"s","[[Le]] di un abrazo a mi abuela."],["nos","a",1,"p","¿[[Nos]] vemos pronto?"],["nos","a",1,"p","La profesora [[nos]] explicó el tema."],
 ["os","a",2,"p","[[Os]] espero en la puerta del cole."],["los","a",3,"p","Los deberes [[los]] hago ahora."],["las","a",3,"p","Las llaves [[las]] tiene mamá."],
 ["les","a",3,"p","[[Les]] conté un chiste a mis amigos."]];
const pStr = (t,p,n)=>`Personal ${t==="t"?"tónico":"átono"}, ${p}.ª persona, ${n==="s"?"singular":"plural"}`;
const SUST = [
 ["[[Saray]] es muy divertida.","Ella"],["[[Carlos]] juega al baloncesto.","Él"],["[[Mi abuela]] hace unos pasteles riquísimos.","Ella"],
 ["[[El profesor]] explica la lección.","Él"],["[[Carlos y Laura]] vieron una película.","Ellos"],["[[Laura y Marta]] están en el parque.","Ellas"],
 ["[[Los niños]] cuidan el huerto.","Ellos"],["[[Las niñas]] cantan en el coro.","Ellas"],["[[Mi hermano y yo]] jugamos al ajedrez.","Nosotros / nosotras"],
 ["[[Saray y yo]] estuvimos paseando cerca del río.","Nosotros / nosotras"],["[[Tú y Pedro]] llegáis tarde.","Vosotros / vosotras"],["[[Tú y tu prima]] sois muy simpáticas.","Vosotros / vosotras"]];
const SUST_O = ["Él","Ella","Ellos","Ellas","Nosotros / nosotras","Vosotros / vosotras"];
const DETPRO = [
 ["Me gusta [[ese]] cuadro.","D"],["Me gusta [[ese]].","P"],["[[Aquella]] casa es enorme.","D"],["La mía es [[aquella]].","P"],
 ["[[Algunos]] amigos vinieron a la fiesta.","D"],["[[Algunos]] no vinieron.","P"],["He comprado [[muchas]] manzanas.","D"],["He comprado [[muchas]].","P"],
 ["[[Este]] libro es mío.","D"],["Mi habitación es [[esta]].","P"],["Tengo [[dos]] hermanos.","D"],["Yo quiero [[dos]].","P"],
 ["[[Esta]] película me encanta.","D"],["Algunos amigos vinieron y [[otros]] llamaron.","P"],["Dame [[otro]] caramelo.","D"],["¿Quieres [[estos]]?","P"]];

const GEN_PRO = [
  ()=>{ const [w,t,p,n,s]=pick(PRON); const r=pStr(t,p,n);
        const wr=[pStr(t==="t"?"a":"t",p,n), pStr(t,p===1?2:p===2?3:1,n), pStr(t,p,n==="s"?"p":"s"), pStr(t==="t"?"a":"t",p,n==="s"?"p":"s")];
        return mc("Analiza el pronombre destacado:", r, sample(wr,3), `«${w}» es ${t==="t"?"tónico":"átono"} de ${p}.ª persona del ${n==="s"?"singular":"plural"}.`, s); },
  ()=>{ const [s,r]=pick(SUST); return mc("¿Por qué pronombre lo sustituyes?", r, sample(SUST_O.filter(x=>x!==r),3), "Los pronombres personales ocupan el lugar del nombre para no repetirlo.", s); },
  ()=>{ const [s,t]=pick(DETPRO); const q={ctx:s, q:"¿La palabra destacada es determinante o pronombre?", o:["Determinante","Pronombre"], a:t==="D"?0:1, fixed:true,
        e: t==="D" ? "Acompaña a un nombre que va detrás: es determinante." : "No acompaña a ningún nombre, ocupa su lugar: es pronombre."}; return q; },
  ()=>{ const [w,t]=pick(PRON); return mc(`¿«${w}» es un pronombre tónico o átono?`, t==="t"?"Tónico":"Átono", [t==="t"?"Átono":"Tónico"], "Átonos: me, te, se, lo, la, le, nos, os, los, las, les. Los demás personales son tónicos."); },
  ()=>pick([
    mc("¿Qué es un pronombre?", "Una palabra que ocupa el lugar del nombre", ["Una palabra que acompaña siempre al nombre","Una palabra que dice cómo es el nombre","Una palabra que indica una acción"], "Los pronombres ocupan el lugar del nombre para no repetirlo."),
    mc("¿Dónde pueden aparecer los pronombres átonos?", "Delante o detrás del verbo", ["Solo delante del nombre","Solo al final de la oración","Solo detrás del nombre"], "Pueden ir delante o detrás del verbo: ¿Lo entiendes? / Puedo entenderlo.")])
];
const W_PRO = [5,3,3,1,1];

/* ===== FORMACIÓN DE PALABRAS ===== */
const FORM = {
 S:["peine","coche","mesa","pan","sol","mar","flor","casa","libro","árbol","tarta","compás","papel","nube","gato","zapato","silla","lápiz"],
 SF:[["ventanas","la -s solo indica plural"],["niñas","-a y -s solo indican femenino y plural"],["perros","la -s solo indica plural"],["gatas","-a y -s solo indican femenino y plural"],["casas","la -s solo indica plural"]],
 D:[["ventanal","ventana + -al"],["destapar","des- + tapar"],["imposible","im- + posible"],["arboleda","árbol + -eda"],["incoloro","in- + color + -o"],["cabezota","cabeza + -ota"],
    ["panadero","pan + -adero"],["florero","flor + -ero"],["zapatería","zapato + -ería"],["casita","casa + -ita"],["deshacer","des- + hacer"],["caminante","caminar + -ante"],

function prep(q){
  if(q.sort){ return {...q, q:SORTQ[q.sort], o:SORTS[q.sort], cols3:true, order:[0,1,2]}; }
  const order = q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
  return {...q, order};
}

function start(m){
  S = {mode:"mission", m, list:buildRound([m],ROUND).map(prep), i:0, ok:0, pts:0, streak:0, wrong:[]};
  $("timer").classList.add("hidden");
  show("game"); renderQ();
}

function startStop(){
  S = {mode:"stop", list:buildRound(MISSIONS,40).map(prep), i:0, ok:0, pts:0, streak:0, wrong:[], t:60};
  $("timer").classList.remove("hidden"); $("timer").textContent = 60;
  show("game"); renderQ();
  S.iv = setInterval(()=>{
    S.t--; $("timer").textContent = S.t;
    if(S.t<=0){ clearInterval(S.iv); finish(); }
  },1000);
}

function answer(idx,btn){

    b.disabled = true;
    if(+b.dataset.idx===q.a) b.classList.add("ok");

  if(ok){ S.ok++; S.streak++; S.pts += 10 + (S.streak>=3?5:0); burst(btn); }
  else { S.streak=0; S.wrong.push(q); }

  $("streak").textContent = S.streak>=2 ? `🔥 ¡Racha de ${S.streak}!` : "";

    setTimeout(()=>{ if(S && S.mode==="stop" && S.t>0){ S.i++; if(S.i>=S.list.length) S.list.push(...buildRound(MISSIONS,20).map(prep)); renderQ(); } }, ok?550:1800);
    return;
  }
  const fb=$("fb"); fb.className = "fb "+(ok?"ok":"bad");
  const yay=["¡Genial!","¡Correcto!","¡Muy bien!","¡Eso es!","¡Crack!"];
  fb.innerHTML = `<b>${ok?yay[Math.floor(Math.random()*yay.length)]:"Casi… ¡fíjate!"}</b>${esc(q.e)}`;
  $("btnNext").classList.remove("hidden");
  $("btnNext").textContent = S.i===S.list.length-1 ? "Ver resultado 🏁" : "Siguiente →";
  $("btnNext").focus({preventScroll:true});
}

$("btnNext").onclick = ()=>{
  S.i++;
  if(S.i>=S.list.length) finish(); else renderQ();
};

function finish(){
  if(S.iv) clearInterval(S.iv);
  const rList=$("rList"); rList.innerHTML="";
  if(S.mode==="mission"){
    const n=S.list.length, pct=S.ok/n;
    const st = pct>=0.9?3: pct>=0.7?2: pct>=0.4?1:0;
    if(st>(best[S.m.id]||0)){ best[S.m.id]=st; saveBest(); }
    $("rTitle").textContent = st===3?"¡Misión perfecta!":st>=2?"¡Misión cumplida!":st===1?"¡Buen intento!":"¡A practicar!";
    $("rStars").textContent = "⭐".repeat(st)+"☆".repeat(3-st);
    $("rText").textContent = `Has acertado ${S.ok} de ${n} · ${S.pts} puntos`;
    if(st>=2) confetti();
  } else {
    const rec = S.pts>(best.stop||0);
    if(rec){ best.stop=S.pts; saveBest(); }
    $("rTitle").textContent = "¡Stop! Se acabó el tiempo";
    $("rStars").textContent = "🏆";
    $("rText").textContent = `${S.ok} aciertos · ${S.pts} puntos${rec?" · ¡NUEVO RÉCORD!":` · Récord: ${best.stop}`}`;
    if(S.ok>=5) confetti();
  }
  const uniq=[...new Set(S.wrong)];
  $("rReview").classList.toggle("hidden", !uniq.length);
  uniq.forEach(q=>{
    const li=document.createElement("li");
    const label = q.w ? `«${q.w}» → ${q.o[q.a]}` : (q.ctx? q.ctx.replace(/\[\[|\]\]/g,"") + " → " : "") + (q.w?"":q.o[q.a]);
    li.innerHTML = `${esc(label)}<span>${esc(q.e)}</span>`;
    rList.appendChild(li);
  });
  show("results");
}

$("btnBack").onclick = ()=>{ if(S&&S.iv) clearInterval(S.iv); S=null; renderHome(); show("home"); };
$("btnHome").onclick = ()=>{ S=null; renderHome(); show("home"); };
$("btnAgain").onclick = ()=>{ const mode=S.mode, m=S.m; mode==="mission"?start(m):startStop(); };

/* ---------- EFECTOS ---------- */
const cv=$("fx"), cx=cv.getContext("2d"); let parts=[], raf=null;
function size(){ cv.width=innerWidth; cv.height=innerHeight; } size(); addEventListener("resize",size);
const COLS=["#ffc53d","#f07b2c","#1f8a8a","#e85a9b","#7a5cd6","#2fa86a"];
function add(x,y,n,spread){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*spread,vy:-Math.random()*spread*0.9-2,g:.25,s:4+Math.random()*5,c:COLS[i%COLS.length],r:Math.random()*6,life:70+Math.random()*40}); if(!raf) loop(); }
function burst(el){ const r=el.getBoundingClientRect(); add(r.left+r.width/2, r.top+r.height/2, 18, 9); }
function confetti(){ for(let k=0;k<4;k++) setTimeout(()=>add(Math.random()*innerWidth, innerHeight*0.35, 40, 14), k*180); }
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=.15; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+20);
  raf = parts.length ? requestAnimationFrame(loop) : null;
  if(!raf) cx.clearRect(0,0,cv.width,cv.height);
}

if(/github\.io$/.test(location.hostname)) $("homeLink").innerHTML='<a href="./" style="color:var(--teal);font-weight:800;text-decoration:none">← Juegos de Lengua</a>';
renderHome();
</script>
</body>
</html>
