<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geosphere Quest 1º ESO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Same family as Mineral / Rock Quest: one-screen game card, English only */
:root{
  --bg:#efede8; --surface:#ffffff; --ink:#22201d; --muted:#665f57; --line:#d9d4cc;
  --a:#b83a2e; --b:#2d5fb3; --c:#c08a12; --d:#2f7d4f;
  --ok:#1f8a4c; --bad:#c23b2c; --accent:#a0522d;
  --crustc:#8a6b4a; --crusto:#4b5563; --um:#d97706; --lm:#b45309; --oc:#ea580c; --ic:#facc15;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181614; --surface:#23201d; --ink:#efebe5; --muted:#aba39a; --line:#3a3530;
  --a:#c9493c; --b:#3a6fc6; --c:#c99a24; --d:#2f8a56; --ok:#3dbb72; --bad:#e25c4c; --accent:#d9834f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ghost{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:inherit;text-decoration:none;white-space:nowrap}
.lead{color:var(--muted);margin:0;line-height:1.5}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .12s}
.mode:active{transform:scale(.97)}
.mode b{font-family:var(--display);font-size:15px}
.mode span{font-size:13.5px;color:var(--muted);line-height:1.4}
.mode i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent)}
.best{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.hud{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.hud .grow{flex:1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:100%;transition:width .1s linear}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent)}
.q{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;line-height:1.35}
.qes{color:var(--muted);font-size:14.5px;text-align:center;margin:0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{color:#fff;border-radius:14px;padding:14px 12px;min-height:64px;font-weight:700;font-size:16px;display:flex;align-items:center;text-align:left;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);transition:opacity .2s,transform .1s;line-height:1.3}
.ans:active{transform:translateY(2px)}
.answers .ans:nth-child(4n+1){background:var(--a)}.answers .ans:nth-child(4n+2){background:var(--b)}.answers .ans:nth-child(4n+3){background:var(--c)}.answers .ans:nth-child(4n+4){background:var(--d)}
.answers.light .ans{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--line);min-height:50px;font-size:15px}
.ans .es{display:block;font-weight:400;font-size:13px;opacity:.85}
.ans.dim{opacity:.28}
.ans.right{outline:4px solid var(--ok);outline-offset:2px;opacity:1}
.ans.wrong{outline:4px solid var(--bad);outline-offset:2px}
.answers.light .ans.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.answers.light .ans.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.feedback{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:2px solid;background:var(--surface)}
.feedback.good{border-color:var(--ok)}.feedback.bad{border-color:var(--bad)}
.feedback h3{font-size:17px}
.feedback.good h3{color:var(--ok)}.feedback.bad h3{color:var(--bad)}
.feedback p{margin:0;line-height:1.45}
.fact{color:var(--muted);font-size:14.5px}
.next{background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;padding:14px;border-radius:12px;font-size:16px;width:100%}
.pop{font-family:var(--mono);color:var(--ok)}
.score{font-family:var(--display);font-weight:800;font-size:56px;text-align:center;font-variant-numeric:tabular-nums}
.sub{text-align:center;color:var(--muted);margin:0}
.misslist{display:flex;flex-direction:column;gap:8px}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.miss b{display:block}
svg text{font-family:var(--body)}
.earth{width:100%;max-width:420px;height:auto;display:block}
.earth .ly{cursor:pointer;transition:opacity .2s}
.earth .ly.off{opacity:.35}
.earth .ly.hl{stroke:var(--ink);stroke-width:4}
.earth .lbl{font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none}
.info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.info b{font-family:var(--display);font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted)}
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.rung{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
.rung .n{font-family:var(--mono);font-weight:500;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.rung.ref{background:transparent;border:1.5px dashed var(--accent);color:var(--accent);font-size:14px;padding:5px 12px}
.rung.ref .n{background:transparent;color:var(--accent);border:1.5px solid var(--accent);width:auto;min-width:34px;padding:0 6px;border-radius:999px}
.rung.empty{color:var(--muted);border-style:dashed}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pool button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700;box-shadow:inset 0 -3px 0 var(--line)}
.pool button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cycle{width:100%;max-width:520px;height:auto;display:block}
.cycle .arr{stroke:var(--line);stroke-width:5;fill:none}
.cycle .arr.hl{stroke:var(--accent);stroke-width:7}
.cycle .arr.done{stroke:var(--ok)}
.cycle .node rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.cycle .node text{font-size:14px;font-weight:700;fill:var(--ink)}
.cycle .alab{font-size:11.5px;fill:var(--ok);font-weight:700}
.cycle .qm{font-size:16px;fill:var(--accent);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{perspective:800px;min-height:150px;text-align:left}
.card .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.face b{font-family:var(--display);font-size:15px}
.face .t{font-family:var(--mono);font-size:11px;color:var(--accent)}
.back{transform:rotateY(180deg)}
.back p{margin:0;font-size:13.5px;line-height:1.4}
.back .esn{color:var(--muted);font-size:13px}
@media (max-width:520px){
  .answers{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .mode{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Content (from Pablo's Unit 1 notebook: Geosphere) ---------- */
const TOPICS = {
  earth:{name:"Inside the Earth"},
  atoms:{name:"Atoms & molecules"},
  min:  {name:"Minerals"},
  rocks:{name:"Rocks"},
  uses: {name:"Uses & extraction"}
};
// q: question · o: options · a: index of right option · w: explanation shown after answering
const Q = [
 // Inside the Earth
 {t:"earth",q:"Which is the thin outer shell of the Earth that we all live on?",o:["Crust","Mantle","Outer core","Inner core"],a:0,w:"The crust is the thinnest layer: the rocks we walk on."},
 {t:"earth",q:"Which layer is the largest part of the Earth?",o:["Mantle","Crust","Outer core","Inner core"],a:0,w:"The mantle is a solid layer of rock and it makes up the largest part of the Earth."},
 {t:"earth",q:"The outer core is made of…",o:["Liquid iron","Solid iron","Granite","Basalt"],a:0,w:"The outer core is liquid iron. This flowing metal generates the magnetic field."},
 {t:"earth",q:"The inner core is…",o:["A solid ball of iron","A liquid ball of iron","Made of granite","Made of water"],a:0,w:"The inner core is a solid ball of iron right in the centre of our planet, about 6,370 km deep."},
 {t:"earth",q:"Which rock makes up the continental crust?",o:["Granite","Basalt","Peridotite","Bridgmanite"],a:0,w:"Continental crust → granite. Oceanic crust → basalt."},
 {t:"earth",q:"Which rock makes up the oceanic crust?",o:["Basalt","Granite","Marble","Limestone"],a:0,w:"The oceanic crust is made of basalt and it is thinner (about 8 km)."},
 {t:"earth",q:"Which crust is thicker?",o:["Continental crust (≈40 km)","Oceanic crust (≈8 km)","They are the same","Neither: the crust has no thickness"],a:0,w:"Continental crust is about 40 km thick (more under mountains); oceanic crust is about 8 km."},
 {t:"earth",q:"The upper mantle is mainly made of…",o:["Olivine (peridotite)","Granite","Liquid iron","Clay"],a:0,w:"Upper mantle: olivine, which forms the rock peridotite. Lower mantle: bridgmanite."},
 {t:"earth",q:"Which mineral is typical of the lower mantle?",o:["Bridgmanite","Quartz","Halite","Gypsum"],a:0,w:"Bridgmanite is the mineral of the lower mantle (and the most abundant mineral on Earth)."},
 {t:"earth",q:"As we go deeper towards the centre, temperature and density…",o:["Both increase","Both decrease","Stay the same","Temperature goes up, density goes down"],a:0,w:"The deeper you go, the hotter and denser it gets: the heaviest materials are in the centre."},
 {t:"earth",q:"What generates the Earth's magnetic field?",o:["Flowing liquid iron in the outer core","The solid crust","The Sun's light","Ocean water"],a:0,w:"Liquid iron moving in the outer core creates the magnetic field."},
 {t:"earth",q:"The magnetic field of the Earth protects us from…",o:["Solar wind","Earthquakes","Rain","Volcanoes"],a:0,w:"It deflects the solar wind (particles coming from the Sun)."},
 {t:"earth",q:"How far is it from the surface to the centre of the Earth?",o:["About 6,370 km","About 40 km","About 700 km","About 100,000 km"],a:0,w:"The radius of the Earth is about 6,370 km."},
 {t:"earth",q:"The continental shelf is the shallow sea next to the coast. How deep is it?",o:["About 200 m","About 20 km","About 3,000 km","About 2 m"],a:0,w:"It goes down to about 200 m. After that, the sea floor drops to the deep ocean (several km)."},
 {t:"earth",q:"Put the layers in order from the outside to the centre.",o:["Crust → mantle → outer core → inner core","Mantle → crust → inner core → outer core","Crust → outer core → mantle → inner core","Inner core → outer core → mantle → crust"],a:0,w:"Crust → mantle → outer core → inner core."},
 // Atoms & molecules
 {t:"atoms",q:"Regular matter is made of…",o:["Atoms","Minerals","Rocks","Crystals"],a:0,w:"Everything is made of atoms. They are very tiny: about 10⁻¹⁰ m."},
 {t:"atoms",q:"Which particles are in the nucleus of an atom?",o:["Protons and neutrons","Electrons only","Molecules","Crystals"],a:0,w:"The nucleus has protons and neutrons. Electrons move around it."},
 {t:"atoms",q:"Atoms are classified into elements according to the number of…",o:["Protons","Neutrons","Electrons in the air","Molecules"],a:0,w:"The number of protons is the atomic number (Z), and it tells you which element it is."},
 {t:"atoms",q:"Which element has atomic number Z = 1?",o:["Hydrogen","Carbon","Iron","Oxygen"],a:0,w:"Z = 1 hydrogen (H) · Z = 6 carbon (C) · Z = 26 iron (Fe)."},
 {t:"atoms",q:"Iron (Fe) has atomic number…",o:["26","6","1","8"],a:0,w:"Iron has 26 protons: Z = 26."},
 {t:"atoms",q:"In the periodic table, elements are ordered by…",o:["Atomic number","Colour","Name in alphabetical order","Hardness"],a:0,w:"They are ordered by atomic number, in rows (periods) and columns (groups)."},
 {t:"atoms",q:"Elements in the same group (column)…",o:["Share many properties","Have the same atomic number","Are always gases","Are always metals"],a:0,w:"Elements in the same group share many properties."},
 {t:"atoms",q:"Which one is written correctly as a chemical symbol?",o:["Na","NA","na","nA"],a:0,w:"A symbol is one capital letter, sometimes followed by one lower-case letter: Na, Fe, Cl, O."},
 {t:"atoms",q:"Groups of atoms bonded together are called…",o:["Molecules","Minerals","Elements","Nuclei"],a:0,w:"Atoms are not usually found alone: they bond together in groups called molecules."},
 {t:"atoms",q:"How many oxygen atoms are there in Fe₂O₃?",o:["3","2","1","5"],a:0,w:"The small number goes after the symbol: Fe₂ = 2 iron atoms, O₃ = 3 oxygen atoms."},
 {t:"atoms",q:"In H₂O, how many oxygen atoms are there?",o:["1","2","0","3"],a:0,w:"If the number is 1, it is not written. H₂O = 2 H + 1 O."},
 // Minerals
 {t:"min",q:"Which of these is NOT a condition to be a mineral?",o:["Being liquid","Being natural","Being inorganic","Having a crystalline structure"],a:0,w:"A mineral is solid, natural, inorganic, a pure substance (it has a formula) and crystalline."},
 {t:"min",q:"Why is water NOT a mineral?",o:["It is not solid","It is not natural","It is organic","It has no formula"],a:0,w:"Liquid water (and mercury) are not solid, so they are not minerals."},
 {t:"min",q:"Why is glass NOT a mineral?",o:["It is not natural (it is made by people)","It is liquid","It is organic","It is too hard"],a:0,w:"Glass and ceramics are made by people: they are not natural."},
 {t:"min",q:"Why are amber or pearls NOT minerals?",o:["They come from living beings (organic)","They are liquid","They are man-made","They have no colour"],a:0,w:"Inorganic means it has never been part of a living being."},
 {t:"min",q:"Crystalline means that atoms are arranged…",o:["In a regular 3D grid","Randomly","In a straight line","Only on the surface"],a:0,w:"The atoms (and molecules) form a regular 3D grid, like in NaCl (salt)."},
 {t:"min",q:"Substances with no crystalline structure are called…",o:["Mineraloids (amorphous)","Crystals","Rocks","Ores"],a:0,w:"They are amorphous, and we call them mineraloids."},
 {t:"min",q:"A crystal is…",o:["A solid with flat geometric faces that forms naturally","Any piece of glass","A liquid mineral","A type of rock"],a:0,w:"A crystal is the macroscopic (visible) result of the crystalline structure."},
 {t:"min",q:"Why is colour NOT a reliable property?",o:["It can change a lot with impurities","It is impossible to see","All minerals are white","It changes with temperature every day"],a:0,w:"Example: quartz can be rock crystal, amethyst, citrine, rose, milky or smoky."},
 {t:"min",q:"Amethyst, citrine and rose quartz are varieties of…",o:["Quartz","Calcite","Gypsum","Mica"],a:0,w:"They are the same mineral (quartz) with different colours because of impurities."},
 {t:"min",q:"Streak is…",o:["The colour of the mineral in powder form","How it shines","How it breaks","Its weight"],a:0,w:"You draw a line with the mineral on a porcelain plate, as if it were a piece of chalk. It is more reliable than colour."},
 {t:"min",q:"Pyrite is golden, but its streak is…",o:["Black","Golden","White","Pink"],a:0,w:"That's why streak helps to identify minerals! Pyrite has a black streak."},
 {t:"min",q:"Lustre describes…",o:["How light interacts with the surface","How heavy it is","Its smell","Its hardness"],a:0,w:"Lustre can be metallic or non-metallic (vitreous, waxy, earthy, pearly, greasy…)."},
 {t:"min",q:"Which one is a NON-metallic lustre?",o:["Vitreous","Metallic","Golden","Magnetic"],a:0,w:"Non-metallic lustres: vitreous, waxy, earthy, pearly, greasy…"},
 {t:"min",q:"Diaphaneity is the ability to…",o:["Let light pass through it","Attract magnets","Scratch glass","Dissolve in water"],a:0,w:"A mineral can be transparent, translucent or opaque."},
 {t:"min",q:"A mineral that lets NO light pass through is…",o:["Opaque","Transparent","Translucent","Vitreous"],a:0,w:"Opaque. Translucent lets some light through; transparent lets all of it through."},
 {t:"min",q:"Calcite shows a double image when you look through it. This is…",o:["Birefringence","Cleavage","Streak","Magnetism"],a:0,w:"Birefringence is the special property of calcite crystals."},
 {t:"min",q:"Most minerals break easily. We say they are…",o:["Brittle","Tough","Malleable","Ductile"],a:0,w:"Most minerals are brittle, even diamond. Tough minerals (malleable, ductile) are typically native metals."},
 {t:"min",q:"A mineral that breaks along flat planes has…",o:["Cleavage","Fracture","Lustre","Streak"],a:0,w:"Cleavage: it breaks along certain planes (calcite, mica). Fracture: irregular surfaces (cinnabar)."},
 {t:"min",q:"Conchoidal fracture means it breaks…",o:["Like glass, with curved surfaces","In perfect cubes","In thin sheets like mica","It never breaks"],a:0,w:"Conchoidal fracture is a special case: it breaks like glass, with curved, shell-like surfaces."},
 {t:"min",q:"Hardness is the ability to…",o:["Scratch or be scratched","Float in water","Shine","Attract magnets"],a:0,w:"Hardness reflects the strength of the bonds between atoms. We measure it with the Mohs scale (1–10)."},
 {t:"min",q:"Which is the softest mineral in the Mohs scale (1)?",o:["Talc","Gypsum","Quartz","Diamond"],a:0,w:"1 talc · 2 gypsum · 3 calcite · 4 fluorite · 5 apatite · 6 orthoclase · 7 quartz · 8 topaz · 9 corundum · 10 diamond."},
 {t:"min",q:"Your fingernail has a hardness of about 2.5. Which mineral can you scratch with it?",o:["Gypsum (2)","Calcite (3)","Quartz (7)","Topaz (8)"],a:0,w:"Your fingernail (2.5) scratches talc and gypsum, but not calcite."},
 {t:"min",q:"Glass has a hardness of about 5.5. Which mineral scratches glass?",o:["Quartz (7)","Calcite (3)","Fluorite (4)","Talc (1)"],a:0,w:"Every mineral harder than 5.5 scratches glass: orthoclase, quartz, topaz, corundum and diamond."},
 {t:"min",q:"Specific gravity compares the mass of a mineral with the mass of the same volume of…",o:["Water","Air","Gold","Sand"],a:0,w:"Diamond: 3.52. Gypsum is light (2.3), baryte is heavy (5). Minerals that contain metals are usually heavier."},
 {t:"min",q:"Which mineral feels HEAVIER in your hand?",o:["Baryte (SG ≈ 5)","Gypsum (SG ≈ 2.3)","They weigh the same","Talc"],a:0,w:"Baryte has a specific gravity of about 5; gypsum, about 2.3."},
 {t:"min",q:"The typical shape of the crystals of a mineral is its…",o:["Habit","Streak","Lustre","Tenacity"],a:0,w:"Habit: cubic, octahedral, hexagonal, rhombohedral… or aggregates: dendritic, acicular, tabular, massive."},
 {t:"min",q:"Calcite fizzes when you drop diluted acid on it. This property is…",o:["Reaction (effervescence)","Magnetism","Taste","Diaphaneity"],a:0,w:"Effervescence with acid is how we recognise calcite and limestone."},
 {t:"min",q:"Which property should you NOT test yourself in the lab?",o:["Taste","Colour","Lustre","Hardness"],a:0,w:"Never taste minerals! (even if halite tastes like salt)."},
 // Rocks
 {t:"rocks",q:"A rock is…",o:["An aggregate of minerals","A single pure substance","Always a crystal","A liquid"],a:0,w:"A rock is a mineral aggregate: a naturally occurring, non-living, stable solid that forms large masses."},
 {t:"rocks",q:"Igneous rocks form when…",o:["Magma cools down","Sediments are compacted","Rocks are pressed without melting","Plants are buried"],a:0,w:"Liquid magma cools down and becomes solid."},
 {t:"rocks",q:"Plutonic rocks cool slowly underground, so they are…",o:["Coarse-grained (big crystals)","Fine-grained","Full of fossils","Always black"],a:0,w:"Slow cooling → big crystals: granite, syenite."},
 {t:"rocks",q:"Volcanic rocks cool quickly, so they are…",o:["Fine-grained (tiny crystals)","Coarse-grained","Layered like slate","Made of shells"],a:0,w:"Fast cooling → tiny crystals or glass: basalt, obsidian."},
 {t:"rocks",q:"Which one is a plutonic rock?",o:["Granite","Basalt","Obsidian","Sandstone"],a:0,w:"Plutonic: granite, syenite. Volcanic: basalt, obsidian."},
 {t:"rocks",q:"Which one is a volcanic rock?",o:["Basalt","Granite","Marble","Gypsum"],a:0,w:"Basalt is lava that cooled quickly."},
 {t:"rocks",q:"Sedimentary rocks form from sediments by…",o:["Compaction and cementation","Melting","Cooling of magma","Magnetism"],a:0,w:"Compaction + cementation = diagenesis (lithification)."},
 {t:"rocks",q:"Diagenesis is also called…",o:["Lithification","Metamorphism","Erosion","Melting"],a:0,w:"Diagenesis or lithification: sediments turn into rock."},
 {t:"rocks",q:"Which one is a DETRITAL sedimentary rock?",o:["Conglomerate","Rock salt","Coal","Marble"],a:0,w:"Detrital: conglomerate, sandstone, clay. Organic: coal. Chemical / evaporites: limestone, rock salt, gypsum."},

/* ---------- Generic multiple-choice engine (quiz, layers, cycle) ---------- */
// item: {html, opts:[{id,label}], key, title, why, missLabel}
function runRound(mode, items, review){
  G={mode, items, i:0, score:0, streak:0, bestStreak:0, right:0, misses:[], review:!!review};
  ask();
}
function ask(){
  stop();
  const it=G.items[G.i], total=G.items.length;
  const it2 = typeof it.build==='function' ? it.build() : it;
  G.cur = it2;
  app.innerHTML = header(true) + `
    <div class="hud"><span>${G.i+1}/${total}</span><span class="grow"></span><span>streak ${G.streak}</span><span>${G.score} pts</span></div>
    ${opts.timer?'<div class="bar"><div id="tb"></div></div>':''}
    <div class="prompt">${it2.html}</div>
    <div class="answers ${it2.light?'light':''}" id="ans">${it2.opts.map(o=>`<button class="ans" data-id="${o.id}">${o.label}</button>`).join('')}</div>
    <div id="fb"></div>`;
  bindHome();
  const t0=performance.now(), LIMIT=20000; G.answered=false;
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(b.dataset.id, performance.now()-t0));
  if(opts.timer){const tb=document.getElementById('tb');
    tick=setInterval(()=>{const left=Math.max(0,1-(performance.now()-t0)/LIMIT);tb.style.width=(left*100)+'%';if(left<=0)answer(null,LIMIT)},100);}
}
function answer(id, ms){
  if(G.answered) return; G.answered=true; stop();
  const it=G.cur, ok=id===it.key; let gained=0;
  if(ok){G.streak++;G.right++;G.bestStreak=Math.max(G.bestStreak,G.streak);gained=points(ms)+(G.streak>=3?100:0);G.score+=gained}
  else{G.streak=0;const src=G.items[G.i];if(!G.misses.includes(src))G.misses.push(src)}
  app.querySelectorAll('.ans').forEach(b=>{b.disabled=true;const bid=b.dataset.id;
    if(bid===it.key)b.classList.add('right');else if(bid===id)b.classList.add('wrong');else b.classList.add('dim')});
  if(it.after) it.after(ok);
  const title = ok?`Correct! <span class="pop">+${gained}</span>`:(id===null?'Time\'s up!':'Not quite!');
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${title}</h3>${ok?'':`<p><b>${it.answerText}</b></p>`}<p class="fact">${it.why}</p>
    <button class="next" id="nx">${G.i+1<G.items.length?'Next':'See results'}</button></div>`;
  const nx=document.getElementById('nx'); nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  nx.onclick=()=>{G.i++;G.i<G.items.length?ask():results()};
}
function results(){
  const total=G.items.length,best=store.get('best',{});let rec=false;
  if(!G.review&&G.score>(best[G.mode]||0)){best[G.mode]=G.score;store.set('best',best);rec=true}
  const pct=Math.round(100*G.right/total);
  const msg=pct===100?'Perfect! You have mastered the geosphere.':pct>=80?'Great job! You almost have it.':pct>=50?'Good work. Review your mistakes and play again.':'Start with the flashcards and the Inside the Earth explorer, then try again.';
  app.innerHTML=header(true)+`
    <div class="prompt"><div class="q">${MODES[G.mode].name}${G.review?' · mistakes review':''}</div>
      <div class="score">${G.score}</div>
      <p class="sub">${G.right} of ${total} correct · best streak ${G.bestStreak}${rec?' · new record!':''}</p><p class="sub">${msg}</p></div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      ${G.misses.length?`<button class="next" id="rv">Review my ${G.misses.length} mistake${G.misses.length>1?'s':''}</button>`:''}
      <button class="ghost" id="again" style="padding:14px">Play again</button></div>
    ${G.misses.length?`<h3 style="font-size:16px">To review</h3><div class="misslist">${G.misses.map(m=>`<div class="miss"><b>${m.missQ}</b>${m.missA}</div>`).join('')}</div>`:''}`;
  bindHome();
  const mode=G.mode, misses=G.misses.slice();
  document.getElementById('again').onclick=()=>({quiz:startQuiz,layers:startLayers,cycle:startCycle})[mode]();
  const rv=document.getElementById('rv'); if(rv) rv.onclick=()=>runRound(mode, shuffle(misses), true);
}

/* ---------- Quiz ---------- */
function quizItem(q){
  return {missQ:q.q, missA:`${q.o[q.a]} — ${q.w}`, build(){
    const order=shuffle(q.o.map((_,i)=>i));
    return {html:`<span class="tag">${TOPICS[q.t].name}</span><div class="q">${q.q}</div>`,
      opts:order.map(i=>({id:String(i),label:q.o[i]})), key:String(q.a), answerText:q.o[q.a], why:q.w};
  }};
}
function startQuiz(){
  const pool = opts.topic==='all' ? Q : Q.filter(q=>q.t===opts.topic);
  let picked;
  if(opts.topic==='all'){ // balanced mix across topics
    const by={}; shuffle(pool).forEach(q=>(by[q.t]=by[q.t]||[]).push(q));
    picked=[]; const keys=shuffle(Object.keys(by));
    while(picked.length<Math.min(opts.len,pool.length)) for(const k of keys){ if(by[k].length&&picked.length<opts.len) picked.push(by[k].shift()) }
    picked=shuffle(picked);
  } else picked=shuffle(pool).slice(0,opts.len);
  runRound('quiz', picked.map(quizItem));
}

/* ---------- Earth cross-section SVG ---------- */
// radii (not to scale: crust exaggerated so it can be tapped)
const R = {crust:180, um:160, lm:122, ocr:82, ic:40};
function earthSVG(hl, labels){
  const cx=200,cy=200;
  const ring=(r1,r0,cls,k)=>`<path class="ly ${cls}" data-k="${k}" fill-rule="evenodd" d="M${cx-r1},${cy}a${r1},${r1} 0 1,0 ${2*r1},0a${r1},${r1} 0 1,0 ${-2*r1},0Z M${cx-r0},${cy}a${r0},${r0} 0 1,0 ${2*r0},0a${r0},${r0} 0 1,0 ${-2*r0},0Z"/>`;
  const half=(r1,r0,side,k)=>{ // side: -1 left (continental), 1 right (oceanic)
    const s=side<0?0:1;
    return `<path class="ly" data-k="${k}" d="M${cx},${cy-r1} A${r1},${r1} 0 0,${side<0?0:1} ${cx},${cy+r1} L${cx},${cy+r0} A${r0},${r0} 0 0,${side<0?1:0} ${cx},${cy-r0}Z"/>`;
  };
  const L=Object.fromEntries(LAYERS.map(l=>[l.k,l]));
  const cls=k=>hl==null?'':(hl===k?'hl':'off');
  const fill=(svg,k)=>svg.replace('class="ly','style="fill:'+L[k].col+'" class="ly '+cls(k));
  let s=`<svg class="earth" viewBox="0 0 400 400" role="img" aria-label="Cross-section of the Earth">`;
  s+=fill(half(R.crust+12,R.um,-1,'cc'),'cc');
  s+=fill(half(R.crust,R.um,1,'oc'),'oc');
  s+=fill(ring(R.um,R.lm,'','um'),'um');
  s+=fill(ring(R.lm,R.ocr,'','lm'),'lm');
  s+=fill(ring(R.ocr,R.ic,'','ocr'),'ocr');
  s+=`<circle class="ly ${cls('ic')}" data-k="ic" cx="${cx}" cy="${cy}" r="${R.ic}" style="fill:${L.ic.col}"/>`;
  if(labels){
    const t=(x,y,txt)=>`<text class="lbl" x="${x}" y="${y}" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface);stroke-width:3px">${txt}</text>`;
    s+=t(200,205,'Inner core')+t(200,140,'Outer core')+t(200,100,'Lower mantle')+t(200,60,'Upper mantle')+t(70,40,'Continental')+t(330,40,'Oceanic');
  }
  return s+`</svg>`;
}
function startLayers(){
  const items=shuffle(LAYERS).concat(shuffle(LAYERS)).slice(0,Math.min(opts.len,12)).map(l=>({
    missQ:l.en, missA:`${l.mat} · ${l.state} · ${l.depth}`,
    build(){ return {html:`${earthSVG(l.k,false)}<div class="q">Which layer is highlighted?</div>`,
      light:true, opts:shuffle(LAYERS).map(x=>({id:x.k,label:x.en})),
      key:l.k, answerText:l.en, why:`${l.mat} · ${l.state} · ${l.depth}. ${l.tip}`}; }
  }));

}

/* ---------- Mohs ladder ---------- */
const REFS={1:['2.5','Fingernail','scratches talc and gypsum'],4:['5.5','Glass','scratched by orthoclase and harder minerals']};
function refRung(i){const r=REFS[i];return r?`<div class="rung ref"><span class="n">${r[0]}</span><b>${r[1]}</b><span class="fact" style="color:inherit">${r[2]}</span></div>`:''}
function startMohs(){
  stop();
  const M={placed:0, errors:0, t0:performance.now()};
  const pool=shuffle(MOHS.map((n,i)=>({n,i})));
  const draw=()=>{
    app.innerHTML=header(true)+`<div class="hud"><span>${M.placed}/10</span><span class="grow"></span><span>mistakes ${M.errors}</span></div>
      <div class="prompt"><div class="q">Build the Mohs scale</div><p class="qes">Tap the minerals in order, from the softest (1) to the hardest (10). Fingernail = 2.5, glass = 5.5.</p></div>
      <div class="pool" id="pool">${pool.filter(p=>p.i>=M.placed).map(p=>`<button data-i="${p.i}">${p.n}</button>`).join('')}</div>
      <div class="ladder">${MOHS.map((n,i)=>(i<M.placed?`<div class="rung"><span class="n">${i+1}</span><b>${n}</b></div>`:`<div class="rung empty"><span class="n" style="background:var(--line);color:var(--muted)">${i+1}</span>?</div>`)+refRung(i)).join('')}</div>
      <div id="fb"></div>`;
    bindHome();
    app.querySelectorAll('#pool button').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===M.placed){M.placed++; M.placed===10?finish():draw()}
      else{M.errors++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        document.getElementById('fb').innerHTML=`<div class="feedback bad"><p>${MOHS[i]} is number ${i+1}. Now tap number <b>${M.placed+1}</b>.</p></div>`;
        app.querySelector('.hud span:last-child').textContent='mistakes '+M.errors;}
    });
  };
  const finish=()=>{
    const secs=(performance.now()-M.t0)/1000;
    const score=Math.max(100,Math.round(5000-M.errors*400-(opts.timer?secs*20:0)));
    const best=store.get('best',{}); let rec=false; if(score>(best.mohs||0)){best.mohs=score;store.set('best',best);rec=true}
    app.innerHTML=header(true)+`<div class="prompt"><div class="q">Mohs ladder</div><div class="score">${score}</div>
      <p class="sub">${M.errors} mistake${M.errors===1?'':'s'} · ${Math.round(secs)} s${rec?' · new record!':''}</p>
      <p class="sub">Tip: <b>T</b>alc <b>G</b>ypsum <b>C</b>alcite <b>F</b>luorite <b>A</b>patite <b>O</b>rthoclase <b>Q</b>uartz <b>T</b>opaz <b>C</b>orundum <b>D</b>iamond</p></div>
      <div class="ladder">${MOHS.map((n,i)=>`<div class="rung"><span class="n">${i+1}</span><b>${n}</b></div>`+refRung(i)).join('')}</div>
      <button class="next" id="again">Play again</button>`;
    bindHome(); document.getElementById('again').onclick=startMohs;
  };
  draw();
}

/* ---------- Rock cycle ---------- */
function cycleSVG(active, done){
  const W=150,H=40;
  const edge=(a,b)=>{ // shorten line so it ends at the box border
    const A=NODES[a],B=NODES[b];const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy);
    const off=t=>{const kx=Math.abs(dx)>0?(W/2+6)/Math.abs(dx):1e9,ky=Math.abs(dy)>0?(H/2+6)/Math.abs(dy):1e9;return Math.min(kx,ky)};
    const k=off(); return [A.x+dx*k, A.y+dy*k, B.x-dx*k, B.y-dy*k];
  };
  let s=`<svg class="cycle" viewBox="0 0 520 380" role="img" aria-label="Rock cycle"><defs>
    <marker id="mh" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a8178"/></marker></defs>`;
  ARROWS.forEach((a,i)=>{
    let [x1,y1,x2,y2]=edge(a.f,a.t);
    // bend paired arrows apart
    const nx=-(y2-y1),ny=x2-x1,nl=Math.hypot(nx,ny)||1,bend=i>=5?-28:22;
    const mx=(x1+x2)/2+nx/nl*bend,my=(y1+y2)/2+ny/nl*bend;
    const c=i===active?'hl':(done.includes(i)?'done':'');
    s+=`<path class="arr ${c}" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" marker-end="url(#mh)" style="${c===''?'':''}"/>`;
    if(i===active) s+=`<text class="qm" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:var(--surface);stroke-width:5px">?</text>`;
    else if(done.includes(i)) s+=`<text class="alab" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px">${PROC[a.p]}</text>`;
  });
  Object.values(NODES).forEach(n=>{s+=`<g class="node"><rect x="${n.x-W/2}" y="${n.y-H/2}" width="${W}" height="${H}" rx="10"/><text x="${n.x}" y="${n.y}" text-anchor="middle" dominant-baseline="middle">${n.en}</text></g>`});
  return s+`</svg>`;
}
function startCycle(){
  const done=[];
  const order=shuffle(ARROWS.map((_,i)=>i));
  const items=order.map(i=>{const a=ARROWS[i];return {
    missQ:`${NODES[a.f].en} → ${NODES[a.t].en}`, missA:`${PROC[a.p]}. ${a.w}`,
    build(){ return {html:`${cycleSVG(i,done)}<div class="q">${NODES[a.f].en} → ${NODES[a.t].en}: which process?</div>`,
      light:true, opts:Object.entries(PROC).map(([k,v])=>({id:k,label:v})),
      key:a.p, answerText:PROC[a.p], why:a.w, after(){ if(!done.includes(i)) done.push(i) }}; }
  }});
  runRound('cycle', items);
}
